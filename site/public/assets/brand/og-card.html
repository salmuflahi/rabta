<!doctype html>
<!--
  Source for the 1200x630 social card. Rendered to og-cover.png by
  scripts/generate-brand-assets.py (headless Chrome at 2x, downsampled).

  Rules this card follows:
    - composed, never a raw screenshot dropped in whole
    - >=64px safe padding on every edge, so platform crops never clip content
    - no availability, version or roadmap claim that could age badly
    - the SAME headline as <meta property="og:title">, verbatim: a card that
      argues one thing while the link preview beside it argues another is the
      one social-image bug nobody catches

  It is the brand at card scale: ink, paper type, the lockup with its ember
  leg, and the real app in a window on the right. Flat surfaces, one ember
  glow, no third hue.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("../fonts/inter-var.woff2") format("woff2");
    font-weight: 400 700;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    background: #0a0b0e;
    color: #f5f5f7;
    font-family: "Inter Var", -apple-system, BlinkMacSystemFont, sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: absolute;
    top: 64px;
    bottom: 64px;
    left: 64px;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .brand img { height: 40px; width: auto; display: block; }

  h1 {
    font-size: 58px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.04em;
    max-width: 10ch;
  }

  h1 .quiet { color: #b4b8c2; }

  .sub {
    margin-top: 22px;
    font-size: 21px;
    line-height: 1.4;
    letter-spacing: -0.012em;
    color: #b4b8c2;
    max-width: 24ch;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    font-weight: 500;
    color: #7c808b;
  }

  .meta .sep { width: 1px; height: 12px; background: #1e2128; }

  /* The real app in a window, on the right, flat. */
  .window {
    position: absolute;
    top: 96px;
    left: 672px;
    width: 640px;
    height: 438px;
    border-radius: 14px;
    background: #14161b;
    box-shadow: 0 0 0 1px rgba(245, 245, 247, 0.16), 0 40px 80px -30px rgba(0, 0, 0, 0.7);
    overflow: hidden;
    z-index: 1;
  }

  .window__bar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 14px;
    background: #0a0b0e;
    border-bottom: 1px solid rgba(245, 245, 247, 0.08);
  }

  .window__bar span { width: 12px; height: 12px; border-radius: 50%; background: #1e2128; }

  .window img {
    display: block;
    width: 1120px;
    height: auto;
    margin: -48px 0 0 -160px;
  }

  .ember {
    position: absolute;
    left: 520px;
    top: 180px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 107, 44, 0.22), transparent);
    filter: blur(30px);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="ember"></div>

  <div class="window">
    <div class="window__bar"><span></span><span></span><span></span></div>
    <img src="../shots/src/overview.png" alt="" />
  </div>

  <div class="card">
    <div class="brand">
      <img src="lockup-paper.svg" alt="" />
    </div>

    <div>
      <h1>Rabta: leave the task, <span class="quiet">return to all of it</span></h1>
      <p class="sub">Workspace memory for macOS</p>
    </div>

    <div class="meta">
      <span>No account</span>
      <span class="sep"></span>
      <span>No telemetry</span>
      <span class="sep"></span>
      <span>No cloud</span>
    </div>
  </div>
</body>
</html>
