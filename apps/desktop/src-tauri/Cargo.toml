[package]
name = "rabta-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "rabta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rabta-hub = { path = "../../../crates/omnibus-hub" }
rabta-db = { path = "../../../crates/omnibus-db" }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "process", "net", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = "0.3"
