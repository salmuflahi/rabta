[package]
name = "omnibus-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "omnibus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnibus-hub = { path = "../../../crates/omnibus-hub" }
omnibus-db = { path = "../../../crates/omnibus-db" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "process"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = "0.3"
