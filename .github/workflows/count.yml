name: Deploy count worker

# Tests, migrates and deploys workers/count, the rabta.build visitor counter,
# to Cloudflare Workers.
#
# ONE-TIME SETUP (repo settings, not automatable from here):
#   1. Settings → Secrets and variables → Actions → Secrets:
#        CLOUDFLARE_API_TOKEN   an API token with Workers Scripts: Edit,
#                               D1: Edit and Account Settings: Read
#        CLOUDFLARE_ACCOUNT_ID  the account id from the Workers overview page
#   2. Settings → Secrets and variables → Actions → Variables:
#        COUNT_DEPLOY = true
#      Until that variable exists the workflow only runs the tests, so a push
#      to main never fails for want of credentials. Secrets cannot be tested
#      in an `if:` expression, which is why the gate is a variable.
#   3. workers/count/wrangler.jsonc must carry the real database_id and the
#      STATS_TOKEN secret must exist (see workers/count/README.md); the first
#      deploy is done by hand from a laptop so those steps can happen in order.

on:
  push:
    branches: [main]
    paths:
      - "workers/count/**"
      - ".github/workflows/count.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and let an in-flight one finish: a migration that is
# half applied is worse than one that is late.
concurrency:
  group: count
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The root package.json has no packageManager field, so the version is
      # pinned here. It has to come before setup-node for the pnpm cache to work.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter rabta-count exec tsc --noEmit

      # Runs inside workerd against a local D1 with the real migrations applied.
      - name: Test
        run: pnpm --filter rabta-count test

  deploy:
    needs: test
    if: ${{ vars.COUNT_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Migrations first, so the code that ships a moment later never meets a
      # table it does not expect. Applying an already-applied set is a no-op.
      - name: Apply D1 migrations
        run: pnpm --filter rabta-count exec wrangler d1 migrations apply count --remote

      - name: Deploy
        run: pnpm --filter rabta-count exec wrangler deploy
