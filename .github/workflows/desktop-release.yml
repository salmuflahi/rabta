name: Publish desktop beta

on:
  push:
    branches: [main]
    paths:
      - 'releases/desktop-beta.json'
      - 'docs/releases/**'
      - 'scripts/publish-desktop-beta.mjs'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A manifest edit is an explicit release request. Serialize releases; an
# interrupted upload stays a draft and can be resumed without replacing assets.
concurrency:
  group: desktop-beta-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'salmuflahi/rabta' && github.ref == 'refs/heads/main'
    name: Verify and package Mac beta
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate version and beta identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const release = read('releases/desktop-beta.json');
          const config = read('apps/desktop/src-tauri/tauri.conf.json');
          const beta = read('apps/desktop/src-tauri/tauri.beta.conf.json');
          assert.match(release.version, /^\d+\.\d+\.\d+-beta\.\d+$/);
          assert.equal(release.tag, `v${release.version}`);
          assert.equal(release.notes, `docs/releases/v${release.version}.md`);
          assert.equal(config.version, release.version);
          assert.equal(beta.productName, 'Rabta Beta');
          assert.equal(beta.identifier, 'com.omnibus.dev.beta');
          assert.equal(beta.bundle.macOS.signingIdentity, '-');
          assert.ok(readFileSync(release.notes, 'utf8').length > 100);
          for (const file of ['apps/desktop/src-tauri/Cargo.toml', 'Cargo.lock']) {
            assert.ok(readFileSync(file, 'utf8').includes(`name = "rabta-desktop"\nversion = "${release.version}"`));
          }
          NODE
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable
      - name: Test release publication safeguards
        run: node --test tests/scripts/publish-desktop-beta.test.mjs
      - name: Test native window calculations
        run: node --test apps/desktop/src-tauri/tests/*.node.mjs
      - name: Test collaboration service
        run: node --test services/teams/*.test.mjs
      - name: Verify and test AI tools
        run: |
          node scripts/sync-mcp-utilities.mjs --check
          pnpm --dir packages/mcp build
          pnpm --dir packages/mcp test
      - name: Test desktop behavior
        run: pnpm --dir apps/desktop test
      - name: Test native desktop
        run: cargo test --locked -p rabta-desktop
      - name: Build versioned beta app and disk image
        run: pnpm --dir apps/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.beta.conf.json -- --locked
      - name: Verify and package release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("releases/desktop-beta.json", "utf8")).version')"
          app_bundle='target/aarch64-apple-darwin/release/bundle/macos/Rabta Beta.app'
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Rabta Beta_${version}_aarch64.dmg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")" = 'com.omnibus.dev.beta'
          codesign --verify --deep --strict "$app_bundle"
          codesign --display --verbose=2 "$app_bundle" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$dmg"
          mkdir -p release-artifacts
          cp "$dmg" "release-artifacts/Rabta_${version}_aarch64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "release-artifacts/Rabta_${version}_aarch64.zip"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { version } = JSON.parse(readFileSync('releases/desktop-beta.json', 'utf8'));
          const build = { version, commit: process.env.GITHUB_SHA, productName: 'Rabta Beta', identifier: 'com.omnibus.dev.beta', architecture: 'aarch64', signing: 'ad-hoc', notarized: false };
          writeFileSync('release-artifacts/BUILD.json', JSON.stringify(build, null, 2) + '\n');
          const names = [`Rabta_${version}_aarch64.dmg`, `Rabta_${version}_aarch64.zip`, 'BUILD.json'];
          const sums = names.map(name => `${createHash('sha256').update(readFileSync(`release-artifacts/${name}`)).digest('hex')}  ${name}`).join('\n') + '\n';
          writeFileSync('release-artifacts/SHA256SUMS', sums);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rabta-beta-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rabta-beta-${{ github.sha }}
          path: release-artifacts
      - name: Publish only the verified beta assets
        run: node scripts/publish-desktop-beta.mjs release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
