name: Deploy website

# Publishes website/ to GitHub Pages.
#
# ONE-TIME SETUP (repo settings, not automatable from here):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Pages → Custom domain: rabta.build  (website/CNAME already
#      carries it, and this workflow ships CNAME to the published root).
#   3. Wait for the certificate to be issued, then tick "Enforce HTTPS".
#      Until that is done, https://rabta.build fails certificate validation
#      because Pages still serves CN=*.github.io — which also breaks the
#      privacy-policy URL the Chrome Web Store and Open VSX listings point at.
#
# There is no build step: the site is hand-authored static HTML/CSS/JS with
# zero dependencies and zero third-party runtime requests. This workflow
# uploads website/ verbatim.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # The contract suite and the media verifier gate this deploy, so a change
      # to either has to re-run it.
      - "tests/site/**"
      - "scripts/verify-media.mjs"
      - "scripts/sync-site-chrome.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffprobe is the only thing here that is not already in the image. The
      # verifier refuses to run without it rather than skipping silently, so a
      # failed install fails the deploy instead of waving the media through.
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The one guard that cannot live in the Node suite: losing the custom
      # domain breaks the privacy-policy URL that the Chrome Web Store and
      # Open VSX listings point at.
      - name: CNAME present
        run: test -f website/CNAME && grep -qx "rabta.build" website/CNAME

      # Everything else — copy, semantics, palette, routes, asset existence,
      # third-party subresources, link safety — is the same suite that runs
      # locally, so CI and a developer's machine cannot disagree about what
      # "passing" means.
      # The eight pages share generated chrome. If a page were edited by hand
      # instead of regenerating, its nav or footer would drift from the rest —
      # this fails the deploy rather than shipping the inconsistency.
      - name: Site chrome is in sync
        run: node scripts/sync-site-chrome.mjs --check

      - name: Verify site contract
        run: node --test tests/site/*.test.mjs

      - name: Verify product media
        run: node scripts/verify-media.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
