name: Deploy website

# Builds site/ with Astro and publishes site/dist to GitHub Pages.
#
# ONE-TIME SETUP (repo settings, not automatable from here):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Pages → Custom domain: rabta.build  (site/public/CNAME
#      already carries it, and the build copies it to the published root).
#   3. Wait for the certificate to be issued, then tick "Enforce HTTPS".
#      Until that is done, https://rabta.build fails certificate validation
#      because Pages still serves CN=*.github.io, which also breaks the
#      privacy-policy URL the Chrome Web Store and Open VSX listings point at.
#
# The build is static: Astro writes plain HTML, one hashed stylesheet bundle
# per page family and one module script, all served from this origin. Nothing
# leaves the origin at runtime, and the privacy page says so.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The contract suite and the media verifier gate this deploy, so a change
      # to either has to re-run it.
      - "tests/site/**"
      - "scripts/verify-media.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24: the tests import the site's TypeScript modules directly
      # (type stripping), and the MCP package needs node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ffprobe is the only thing here that is not already in the image. The
      # verifier refuses to run without it rather than skipping silently, so a
      # failed install fails the deploy instead of waving the media through.
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Type-check the site
        run: pnpm --filter @rabta/site check

      - name: Build the site
        run: pnpm build:site

      # The one guard that cannot live in the Node suite: losing the custom
      # domain breaks the privacy-policy URL that the Chrome Web Store and
      # Open VSX listings point at.
      - name: CNAME present in the build
        run: test -f site/dist/CNAME && grep -qx "rabta.build" site/dist/CNAME

      # Everything else (copy, semantics, palette, routes, asset existence,
      # third-party subresources, link safety) is the same suite that runs
      # locally, so CI and a developer's machine cannot disagree about what
      # "passing" means.
      - name: Verify site contract
        run: node --test tests/site/*.test.mjs

      - name: Verify product media
        run: node scripts/verify-media.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
