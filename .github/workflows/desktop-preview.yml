name: Desktop preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'services/teams/**'
      - 'packages/mcp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-preview.yml'
  workflow_dispatch:

# Preview artifacts only. No signing secrets, release publishing or deployment.
permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Apple Silicon preview
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable
      - name: Test native window calculations
        run: node --test apps/desktop/src-tauri/tests/*.node.mjs
      - name: Test collaboration service
        run: node --test services/teams/*.test.mjs
      - name: Verify AI utility source
        run: node scripts/sync-mcp-utilities.mjs --check
      - name: Build and test AI tools
        run: pnpm --dir packages/mcp build && pnpm --dir packages/mcp test
      - name: Test desktop behavior
        run: pnpm --dir apps/desktop test
      - name: Typecheck and build frontend
        run: pnpm --dir apps/desktop build
      - name: Test native desktop
        run: cargo test --locked -p rabta-desktop
      - name: Build preview app
        run: pnpm --dir apps/desktop tauri build --target aarch64-apple-darwin --bundles app --config src-tauri/tauri.preview.conf.json -- --locked
      - name: Package and verify preview
        run: |
          set -euo pipefail
          app_bundle='target/aarch64-apple-darwin/release/bundle/macos/Rabta Preview.app'
          codesign --verify --deep --strict "$app_bundle"
          mkdir -p preview-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" preview-artifacts/Rabta-Lens-Preview-macOS-arm64.zip
          cp docs/DESKTOP-PREVIEW.md preview-artifacts/README.md
          git rev-parse HEAD > preview-artifacts/COMMIT.txt
          shasum -a 256 preview-artifacts/Rabta-Lens-Preview-macOS-arm64.zip > preview-artifacts/SHA256SUMS.txt
      - name: Upload Mac preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rabta-Lens-Preview-macOS-arm64
          path: preview-artifacts/
          if-no-files-found: error
          retention-days: 14
