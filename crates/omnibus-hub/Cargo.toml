[package]
name = "omnibus-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
dirs = "5"
omnibus-db = { path = "../omnibus-db" }
