<!-- Security policy, shared by every route.

     GitHub Pages serves static files and cannot set response headers, so this
     is delivered as a meta element. Two consequences worth stating rather than
     leaving for someone to discover:

       - `frame-ancestors`, `report-uri` and `sandbox` are ignored in a meta
         CSP by specification, so clickjacking protection cannot be enforced
         here. It would need a host that sets real headers.
       - Everything else below IS enforced.

     The policy is strict because the site earns it: zero third-party requests,
     zero inline styles, zero inline scripts. `tests/site/site-contract.test.mjs`
     already fails the build on an off-origin subresource, so the CSP and the
     test agree — the policy is not aspirational.

     `style-src 'self'` with no 'unsafe-inline' is why media slots carry an
     aspect-ratio class rather than a style attribute. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" />

<!-- Send the origin, never the path, to another site — so a link out of the
     privacy page does not tell the destination which page you were reading. -->
<meta name="referrer" content="strict-origin-when-cross-origin" />
