<!doctype html>
<!--
  Source for the 1200x630 social card. Rendered to og-cover.png by
  scripts/generate-brand-assets.py (headless Chrome at 2x, downsampled).

  Rules this card follows:
    - composed, never a raw screenshot dropped in whole
    - >=64px safe padding on every edge, so platform crops never clip content
    - no platform or availability claim that could age badly
    - the current Rabta mark only
    - the SAME headline as <meta property="og:title">, verbatim. A card that
      argues one thing while the link preview beside it argues another is the
      one bug in a social image nobody catches, because the two are never
      rendered side by side except by the platform.

  It is built from docs/site-design-plan.md §4 and nothing else: the twelve
  colour tokens, weights 400-600, the 45-degree fold, flat surfaces. There are
  no gradients and no third hue on this site, so there are none here.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter Variable";
    src: url("../fonts/inter-latin-variable.woff2") format("woff2");
    /* The subset ships 400-600. Declaring 100-900 invited a synthesised 700,
       which is what the previous card was actually rendering. */
    font-weight: 400 600;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    /* --ground. Flat. */
    background: #0a1314;
    color: #f3f0e8;
    font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Safe area: nothing meaningful crosses this inset. */
  .card {
    position: absolute;
    inset: 64px;
    width: 600px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 44px; height: 44px; display: block; }
  .brand .word {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  /* The site's own display step, scaled for a card read at thumbnail size. */
  h1 {
    font-size: 60px;
    font-weight: 600;
    line-height: 62px;
    letter-spacing: -1.32px;
    padding-block: 6px;
  }

  .sub {
    margin-top: 24px;
    font-size: 23px;
    line-height: 34px;
    letter-spacing: -0.27px;
    font-weight: 400;
    /* --text-2 */
    color: #a9bcba;
    max-width: 520px;
  }

  /* Three verified absences, in the machine register. No dots, no ticks, no
     badge — the same call the page's privacy section makes. */
  .meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 17px;
    letter-spacing: 0.24px;
    /* --text-3 */
    color: #7c8f8e;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .meta .sep { color: #1d3536; }

  /* A framed fragment of the real app, flat and bleeding off the right edge.
     Not tilted: the site never renders the product in perspective, because a
     product shown at an angle is a product you are being sold rather than
     shown. */
  .shot {
    position: absolute;
    top: 96px;
    left: 700px;
    width: 720px;
    height: 456px;
    /* --panel, --hairline-strong */
    background: #102526;
    border: 1px solid rgba(243, 240, 232, 0.14);
    border-radius: 12px 0 0 12px;
    overflow: hidden;
  }
  .shot img {
    display: block;
    width: 1024px;
    height: auto;
    /* Frame the workspace pane, away from the window's top chrome. */
    margin: -30px 0 0 -24px;
  }
  /* Fade the far edge into the ground so the crop reads as intentional. */
  .shot::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(96deg, rgba(10, 19, 20, 0) 46%, #0a1314 96%);
  }

  /* The one accent instance on the card, and the same gesture the page makes
     above its hero: the fold's underside, at the top-right corner. */
  .fold {
    position: absolute;
    top: 0;
    right: 0;
    width: 96px;
    height: 96px;
    background: #ff6b2c;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="shot">
    <img src="../shots/src/overview.png" alt="" />
  </div>
  <div class="fold"></div>

  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#102526"/>
        <path fill="#F3F0E8" fill-rule="evenodd" d="M13 8h28.5L56 22.5V51a5 5 0 0 1-5 5H22L8 42V13a5 5 0 0 1 5-5Zm8 13h14v-5l14 16-14 16v-5H25l-8-8V25a4 4 0 0 1 4-4Z"/>
        <path fill="#FF6B2C" d="M41.5 8v14.5H56Z"/>
      </svg>
      <span class="word">Rabta</span>
    </div>

    <div>
      <h1>Leave the task.<br />Keep your place.</h1>
      <p class="sub">Rabta saves the files, terminals, browser tabs and git branch a task had open, and puts them back when you return to it.</p>
    </div>

    <div class="meta">
      <span>No account</span>
      <span class="sep">/</span>
      <span>No telemetry</span>
      <span class="sep">/</span>
      <span>No cloud</span>
    </div>
  </div>
</body>
</html>
