<!doctype html>
<!--
  Source for the 1200x630 social card. Rendered to og-cover.png by
  scripts/generate-brand-assets.py (headless Chrome at 2x, downsampled).

  Rules this card follows:
    - composed, never a raw screenshot dropped in whole
    - >=64px safe padding on every edge, so platform crops never clip content
    - no availability, version or roadmap claim that could age badly. The one
      platform word here — macOS — is what the product IS, not a claim about
      where it is going; it is the page's own hero eyebrow, verbatim.
    - the current Rabta mark only, and only once: the headline already opens
      with the word Rabta, so the wordmark beside it would say it twice.
    - the SAME headline as <meta property="og:title">, verbatim. A card that
      argues one thing while the link preview beside it argues another is the
      one bug in a social image nobody catches, because the two are never
      rendered side by side except by the platform.

  It is the Living Instrument system at card scale: petrol is the world, one
  cool-field sheet carries the product, and the orange fold is the single
  accent. The sheet's clipped corner and the fold triangle use the same
  geometry as .return-field in css/landing.css. Flat surfaces, no gradients,
  no third hue.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter Variable";
    src: url("../fonts/inter-latin-variable.woff2") format("woff2");
    /* The subset ships 400-600. Declaring 100-900 invited a synthesised 700,
       which is what the previous card was actually rendering. */
    font-weight: 400 600;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    /* --petrol. Flat. */
    background: #102526;
    color: #f3f0e8;
    font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Safe area: nothing meaningful crosses this inset. */
  .card {
    position: absolute;
    top: 64px;
    bottom: 64px;
    left: 64px;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .brand svg { width: 44px; height: 44px; display: block; border-radius: 10px; }

  /* The site's own display step, scaled for a card read at thumbnail size. */
  h1 {
    font-size: 54px;
    font-weight: 600;
    line-height: 56px;
    letter-spacing: -1.32px;
    padding-block: 6px;
  }

  /* The second line drops to --cool-mid, exactly as the page hero does. The
     accent is spoken for by the fold and is never used on type. */
  h1 .quiet { color: #66858c; }

  .sub {
    margin-top: 22px;
    font-size: 21px;
    line-height: 32px;
    letter-spacing: -0.25px;
    font-weight: 400;
    /* --cool-soft */
    color: #a9bec2;
    max-width: 500px;
  }

  /* Three verified absences, in the machine register. No dots, no ticks, no
     badge — the same call the page's privacy section makes. */
  .meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 16px;
    letter-spacing: 0.24px;
    /* --cool-mid */
    color: #66858c;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .meta .sep { color: #173239; }

  /* The Return Field at card scale: a cool-field sheet whose top-right corner
     is cut at 45 degrees, holding the real product on a petrol stage. Same
     geometry as .return-field in css/landing.css, scaled 72px -> 64px. */
  .field {
    position: absolute;
    top: 96px;
    left: 672px;
    width: 464px;
    height: 438px;
    z-index: 1;
  }

  .field::before {
    content: "";
    position: absolute;
    inset: 0;
    /* --cool-field */
    background: #d9e3e3;
    clip-path: polygon(0 0, calc(100% - 64px) 0, 100% 64px, 100% 100%, 0 100%);
  }

  /* The one accent instance on the card, and the same gesture the page makes
     above its hero: the fold's underside, at the top-right corner. */
  .field::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 64px;
    height: 64px;
    /* --orange */
    background: #ff6b2c;
    clip-path: polygon(0 0, 100% 100%, 100% 0);
    z-index: 3;
  }

  /* A framed fragment of the real app, flat and cropped by the stage. Not
     tilted: the site never renders the product in perspective, because a
     product shown at an angle is a product you are being sold rather than
     shown. */
  .stage {
    position: absolute;
    inset: 30px;
    overflow: hidden;
    /* --cool-panel */
    background: #173239;
    border: 1px solid rgba(16, 37, 38, 0.16);
    border-radius: 9px;
    z-index: 2;
  }

  /* The source is 2560x1600 (2x of 1280x800), so every offset here is a
     fraction of it rather than a nudge: at 790px the scale is 0.3086, the app
     sidebar ends at x=559 and the window chrome at y=120, and the right edge
     lands in the gap between two stat cards. Eyeballing this slices the
     headings mid-word, which reads as a mistake rather than a crop. */
  .stage img {
    display: block;
    width: 790px;
    height: auto;
    margin: -37px 0 0 -172px;
  }
</style>
</head>
<body>
  <div class="field">
    <div class="stage">
      <img src="../shots/src/overview.png" alt="" />
    </div>
  </div>

  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#102526"/>
        <path fill="#f3f0e8" fill-rule="evenodd" d="M13 8h28.5L56 22.5V51a5 5 0 0 1-5 5H22L8 42V13a5 5 0 0 1 5-5Zm8 13h14v-5l14 16-14 16v-5H25l-8-8V25a4 4 0 0 1 4-4Z"/>
        <path fill="#ff6b2c" d="M41.5 8v14.5H56Z"/>
      </svg>
    </div>

    <div>
      <h1>Rabta — Pick up the task. <br /><span class="quiet">Not the pieces.</span></h1>
      <p class="sub">Workspace memory for macOS</p>
    </div>

    <div class="meta">
      <span>No account</span>
      <span class="sep">/</span>
      <span>No telemetry</span>
      <span class="sep">/</span>
      <span>No cloud</span>
    </div>
  </div>
</body>
</html>
